<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT+ | ملخصات الثغرات الأمنية</title>
    <link rel="stylesheet" href="bash-style.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2368362978436357" crossorigin="anonymous"></script>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html">BIT+</a>
    </div>
    <nav>
        <a href="https://github.com/mu-b003" target="_blank">GitHub</a>
    </nav>
</header>


<div class="ads-wrapper-layout">
    <div class="content-container">
        <h1 class="main-title">Encyclopedia of Security Vulnerabilities Summaries</h1>
        <div class="subtitle">Search the site's local cache to get the vulnerability summary immediately. The remaining course summaries will be uploaded</div>

        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Type the vulnerability name here for instant search..." oninput="searchVulnerabilities()">
        </div>

        <div id="resultsDisplayArea" class="results-display-area"></div>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-right">
            <span>منصة BI</span>
            <span>|</span>
            <span>&copy; 2026 جميع الحقوق محفوظة.</span>
        </div>
        <div class="footer-left">
            <a href="about.html">من نحن</a>
            <a href="privacy-policy.html">سياسة الخصوصية</a>
            <a href="contact.html">اتصل بنا</a>
        </div>
    </div>
</footer>

<script src="data.js"></script>
<script src="data.js"></script>

<script>
// تهيئة البحث
let fuse;
window.onload = function() {
    if (typeof allVulnerabilities !== 'undefined') {
        const options = {
            keys: ['title', 'summary', 'tags'],
            threshold: 0.3,
            ignoreLocation: true
        };
        fuse = new Fuse(allVulnerabilities, options);
        displayResults(allVulnerabilities.slice(0, 3));
    }
};

// دالة البحث الذكي
function searchVulnerabilities() {
    var query = document.getElementById('searchInput').value.trim();
    if (query === "") {
        displayResults(allVulnerabilities.slice(0, 3));
        return;
    }
    var results = fuse.search(query).map(result => result.item);
    displayResults(results);
}

// دالة العرض الأصلية الخاصة بك
function displayResults(data) {
    var container = document.getElementById('resultsDisplayArea');
    container.innerHTML = ""; 

    if (data.length === 0) {
        container.innerHTML = '<div class="no-results">عذراً، لم يتم العثور على نتائج.</div>';
        return;
    }

    data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'vuln-card';
        card.innerHTML = `<h2 class="vuln-title">${item.title}</h2><p class="vuln-text">${item.summary}</p>`;
        container.appendChild(card);
    });
}
</script>
</body>
</html>
