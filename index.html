<script>
// تهيئة البحث
let fuse;
window.onload = function() {
    if (typeof allVulnerabilities !== 'undefined') {
        const options = {
            keys: ['title', 'summary', 'tags'],
            threshold: 0.3,
            ignoreLocation: true
        };
        fuse = new Fuse(allVulnerabilities, options);
        displayResults(allVulnerabilities.slice(0, 3));
    }
};

// دالة البحث الذكي
function searchVulnerabilities() {
    var query = document.getElementById('searchInput').value.trim();
    if (query === "") {
        displayResults(allVulnerabilities.slice(0, 3));
        return;
    }
    var results = fuse.search(query).map(result => result.item);
    displayResults(results);
}

// دالة العرض الأصلية الخاصة بك
function displayResults(data) {
    var container = document.getElementById('resultsDisplayArea');
    container.innerHTML = ""; 

    if (data.length === 0) {
        container.innerHTML = '<div class="no-results">عذراً، لم يتم العثور على نتائج.</div>';
        return;
    }

    data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'vuln-card';
        card.innerHTML = `<h2 class="vuln-title">${item.title}</h2><p class="vuln-text">${item.summary}</p>`;
        container.appendChild(card);
    });
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const overlay = document.createElement("div");
    overlay.style.cssText = `
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.9);
        z-index:99999;
        justify-content:center;
        align-items:center;
        cursor:pointer;
    `;

    const img = document.createElement("img");
    img.style.cssText = `
        max-width:95%;
        max-height:95vh;
        object-fit:contain;
    `;

    overlay.appendChild(img);
    document.body.appendChild(overlay);

    document.querySelectorAll(".images").forEach(image => {
        image.style.cursor = "zoom-in";

        image.addEventListener("click", function () {
            img.src = this.src;
            overlay.style.display = "flex";
        });
    });

    overlay.addEventListener("click", function () {
        overlay.style.display = "none";
    });

});
</script>
