<script>
// دالة البحث الذكي (تعمل مباشرة لأن cache.js تم تحميله بالفعل)
function searchVulnerabilities() {
    // التأكد من أن المصفوفة موجودة
    if (typeof allVulnerabilities === 'undefined') return;

    var query = document.getElementById('searchInput').value.toLowerCase().trim();
    var container = document.getElementById('resultsDisplayArea');
    
    if (query === "") {
        displayResults(allVulnerabilities.slice(0, 3));
        return;
    }

    var filtered = allVulnerabilities.filter(function(item) {
        return item.title.toLowerCase().indexOf(query) > -1 || 
               item.summary.toLowerCase().indexOf(query) > -1;
    });

    displayResults(filtered);
}

// دالة العرض
function displayResults(data) {
    var container = document.getElementById('resultsDisplayArea');
    container.innerHTML = ""; 

    if (data.length === 0) {
        container.innerHTML = '<div class="no-results">عذراً، لم يتم العثور على نتائج.</div>';
        return;
    }

    data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'vuln-card';
        card.innerHTML = `<h2 class="vuln-title">${item.title}</h2><p class="vuln-text">${item.summary}</p>`;
        container.appendChild(card);
    });
}

// تشغيل عند تحميل الصفحة
window.onload = function() {
    if (typeof allVulnerabilities !== 'undefined') {
        displayResults(allVulnerabilities.slice(0, 3));
    }
};
</script>
