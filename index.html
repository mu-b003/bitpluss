<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT+ | ملخصات الثغرات الأمنية</title>
    <style>
        /* تثبيت الفوتر: تحويل الـ body إلى حاوية مرنة عمودية */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #5d66e4;
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #333;
        }

        /* جعل المحتوى الأوسط يتمدد ليدفع الفوتر للأسفل */
        .ads-wrapper-layout {
            flex: 1; 
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar-ad-zone {
            width: 160px;
            min-width: 160px;
            max-width: 160px;
            min-height: 600px;
            background-color: #f9f9f9;
            border: 1px dashed #ccc;
            flex-shrink: 0; /* منع انكماش الصناديق */
        }

        .content-container {
            flex: 1;
            margin: 0 20px;
            max-width: 800px;
            text-align: center;
        }

        /* تنسيق الأكواد - الحل الجذري للمشاكل السابقة */
        code, pre {
            direction: ltr !important;
            text-align: left;
            display: block;
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            box-sizing: border-box;
        }

        .site-footer {
            background-color: #0a0a0a;
            color: #aaa;
            padding: 20px 0;
            font-size: 13px;
            border-top: 1px solid #222;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* باقي التنسيقات كما هي */
        .logo a { color: #ffffff; text-decoration: none; font-size: 26px; font-weight: bold; }
        .logo span { color: #ff3333; }
        nav a { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 5px 15px; border-radius: 4px; }
        .vuln-card { background: #fff; border: 1px solid #000; padding: 20px; margin-bottom: 15px; }
        .vuln-title { color: #ff3333; }
        .search-input { width: 100%; max-width: 600px; padding: 12px; border: 2px solid #000; }
    </style>
</head>
<body>

<header>
    <nav><a href="https://github.com/mu-b003" target="_blank">GitHub</a></nav>
    <div class="logo"><a href="index.html">+BIT</a></div>
</header>

<div class="ads-wrapper-layout">
    <div class="sidebar-ad-zone"></div>
    <div class="content-container">
        <h1 class="main-title">موسوعة ملخصات الثغرات الأمنية</h1>
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن ثغرة..." oninput="searchVulnerabilities()">
        </div>
        <div id="resultsDisplayArea" class="results-display-area"></div>
    </div>
    <div class="sidebar-ad-zone"></div>
</div>

<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-right"><span>منصة +BIT | &copy; 2026</span></div>
        <div class="footer-left">
            <a href="about.html">من نحن</a>
            <a href="privacy-policy.html">سياسة الخصوصية</a>
        </div>
    </div>
</footer>

<script src="cache.js"></script>
<script>
    function displayResults(data) {
        var container = document.getElementById('resultsDisplayArea');
        container.innerHTML = ""; 
        data.forEach(function(item) {
            var card = document.createElement('div');
            card.className = 'vuln-card';
            // نضع الكود داخل وسم <pre> ليتم تنسيقه تلقائياً بواسطة CSS
            card.innerHTML = `<h2 class="vuln-title">${item.title}</h2><div class="vuln-text">${item.summary}</div>`;
            container.appendChild(card);
        });
    }
    // ... باقي دوال الجافا سكريبت كما كانت
</script>
</body>
</html>
